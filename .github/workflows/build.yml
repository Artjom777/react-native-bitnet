name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Make gradlew executable
        run: chmod +x example/android/gradlew

      - name: Install dependencies via Yarn
        run: |
          yarn install --frozen-lockfile || yarn install

      - name: Build root module
        run: |
          yarn prepare || npm run prepare || true

      - name: Bundle React Native JS
        run: |
          cd example
          mkdir -p android/app/src/main/assets
          npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res || true

      - name: Build Android APK
        run: |
          cd example/android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitnet-chat-apk
          path: example/android/app/build/outputs/apk/**/*.apk
          
